<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Inquiry — EE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E0B16;
    --bg-raised: #171126;
    --purple: #7B42BC;
    --violet: #A067DA;
    --lavender: #C9BFDD;
    --white: #FFFFFF;
    --line: rgba(160, 103, 218, 0.18);
    --mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--lavender);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--purple); color: var(--white); }

  a { color: var(--violet); text-decoration: none; }
  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--violet);
    outline-offset: 2px;
    border-radius: 2px;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

  /* ---------- Nav ---------- */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    background: rgba(14, 11, 22, 0.82);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
  }
  .nav-mark {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Sora', sans-serif; font-weight: 800; font-size: 18px;
    color: var(--white); letter-spacing: 0.02em;
  }
  .nav-mark svg { display: block; }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a {
    font-family: var(--mono); font-size: 13px; color: var(--lavender);
    transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--white); }

  /* ---------- Section scaffolding ---------- */
  section { padding: 160px 0 110px; }

  .sec-label {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--mono); font-size: 12px;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--violet);
    margin-bottom: 22px;
  }
  .sec-label svg { flex: none; }

  h2 {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 4.5vw, 42px);
    letter-spacing: -0.015em;
    color: var(--white);
    max-width: 640px;
    line-height: 1.2;
    margin-bottom: 20px;
  }
  .lede { max-width: 620px; font-size: 17px; }

  .hero-cta {
    display: inline-block;
    font-family: var(--mono); font-size: 14px;
    color: var(--white);
    background: linear-gradient(135deg, var(--purple), #5B2E96);
    border: 1px solid rgba(160, 103, 218, 0.5);
    padding: 13px 30px;
    border-radius: 4px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .hero-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(123, 66, 188, 0.4);
  }

  /* ---------- Form ---------- */
  .form-card {
    margin-top: 48px;
    max-width: 720px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 44px 40px;
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .field { margin-bottom: 24px; }
  .field label {
    display: block;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--white);
    margin-bottom: 8px;
  }
  .req { color: var(--violet); }
  .field input[type="text"],
  .field input[type="email"],
  .field input[type="tel"],
  .field select,
  .field textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 11px 14px;
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--violet);
    outline: none;
  }
  .field textarea { min-height: 120px; resize: vertical; }
  .field select {
    appearance: none;
    background-image: url("data:image/svg+xml,%3Csvg width='10' height='7' viewBox='0 0 10 7' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='0,0 10,0 5,7' fill='%23A067DA'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
  }
  .radio-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 20px;
  }
  .radio-group label {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: var(--lavender);
    cursor: pointer;
  }
  .radio-group input[type="radio"] {
    accent-color: var(--purple);
    width: 16px; height: 16px;
  }
  .skip-line {
    margin-top: 28px;
    font-family: var(--mono);
    font-size: 13px;
    color: rgba(201, 191, 221, 0.65);
  }

  footer {
    padding: 34px 0 44px;
    border-top: 1px solid var(--line);
  }
  .footer-inner {
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--mono); font-size: 12px;
    color: rgba(201, 191, 221, 0.55);
  }

  @media (max-width: 820px) {
    .nav-links { display: none; }
    section { padding: 130px 0 80px; }
    .form-card { padding: 32px 24px; }
    .form-row, .radio-group { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<nav>
  <div class="wrap nav-inner">
    <a href="/" style="color: inherit;">
      <span class="nav-mark">
        <svg width="26" height="30" viewBox="0 0 26 30" aria-hidden="true">
          <text x="13" y="13" text-anchor="middle" font-family="Sora, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">EE</text>
          <polygon points="4,18 22,18 13,29" fill="url(#navGrad)"/>
          <defs>
            <linearGradient id="navGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#A067DA"/>
              <stop offset="100%" stop-color="#7B42BC" stop-opacity="0.15"/>
            </linearGradient>
          </defs>
        </svg>
        Engineering Excellence
      </span>
    </a>
    <div class="nav-links">
      <a href="/#pillars">what we do</a>
      <a href="/#approach">approach</a>
      <a href="/#book">book</a>
      <a href="/#connect">connect</a>
    </div>
  </div>
</nav>

<section>
  <div class="wrap">
    <div class="sec-label">
      <svg width="12" height="10" viewBox="0 0 12 10" aria-hidden="true"><polygon points="0,0 12,0 6,10" fill="#7B42BC"/></svg>
      Project inquiry
    </div>
    <h2>Tell us what's happening.</h2>
    <p class="lede">The more context you give, the faster we can help. Prefer to talk it through? <a href="https://calendar.google.com/calendar/appointments/schedules/YOUR_ID" target="_blank" rel="noopener">Book a call instead →</a></p>

    <form class="form-card" action="#" method="POST">
      <div class="form-row">
        <div class="field">
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="first_name" autocomplete="given-name">
        </div>
        <div class="field">
          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="last_name" autocomplete="family-name">
        </div>
      </div>

      <div class="field">
        <label for="email">Email <span class="req">*</span></label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>

      <div class="field">
        <label for="company">Company name <span class="req">*</span></label>
        <input type="text" id="company" name="company" required autocomplete="organization">
      </div>

      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder="+1">
      </div>

      <div class="field">
        <label>Service Type</label>
        <div class="radio-group">
          <label><input type="radio" name="service" value="general-consulting"> General consulting</label>
          <label><input type="radio" name="service" value="coaching"> Coaching</label>
          <label><input type="radio" name="service" value="training"> Training</label>
          <label><input type="radio" name="service" value="infrastructure"> Infrastructure</label>
          <label><input type="radio" name="service" value="automation"> Automation</label>
          <label><input type="radio" name="service" value="linux"> Linux</label>
          <label><input type="radio" name="service" value="cloud"> Cloud</label>
          <label><input type="radio" name="service" value="kubernetes"> Kubernetes</label>
          <label><input type="radio" name="service" value="iac"> IaC</label>
        </div>
      </div>

      <div class="field">
        <label for="details">Tell us what's happening?</label>
        <textarea id="details" name="details"></textarea>
      </div>

      <div class="field">
        <label for="urgency">How soon are you looking to address this?</label>
        <select id="urgency" name="urgency">
          <option value="" selected></option>
          <option value="asap">Right away</option>
          <option value="month">Within a month</option>
          <option value="quarter">This quarter</option>
          <option value="exploring">Just exploring</option>
        </select>
      </div>

      <button type="submit" class="hero-cta">Submit</button>

      <p class="skip-line">// prefer to skip the form? <a href="https://calendar.app.google/7tcLkswYG6fQ9a9z6" target="_blank" rel="noopener">book a call directly →</a></p>
    </form>
  </div>
</section>

<footer>
  <div class="wrap footer-inner">
    <span>EE // Engineering Excellence</span>
    <span>© 2026</span>
  </div>
</footer>

</body>
</html>
